[package]
name = "tasklens"
version = "0.1.0"
description = "A transparent Windows system monitor"
authors = ["TaskLens contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
