[package]
name = "tasklens"
version = "0.1.0"
description = "A transparent Windows system monitor"
authors = ["TaskLens contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.40"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Services", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
winreg = "0.56.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
