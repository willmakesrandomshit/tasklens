name: Pre-release
# Publishes UNSIGNED pre-release builds from version tags (e.g. v0.1.0-alpha.1).
# Stable releases are intentionally not automated until the app is verified.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build
        run: npm run tauri build
      - name: Package and publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          Copy-Item src-tauri/target/release/tasklens.exe dist-artifacts/TaskLens-portable-x64.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-artifacts/
          Get-ChildItem dist-artifacts -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist-artifacts/SHA256SUMS.txt
          $notes = "Development pre-release. Binaries are UNSIGNED, so Windows SmartScreen may warn. Not a stable release; see docs/KNOWN_LIMITATIONS.md."
          gh release create "${{ github.ref_name }}" dist-artifacts/* --prerelease --generate-notes --notes "$notes"
