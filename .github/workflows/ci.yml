name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Frontend checks
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run typecheck
          npm run lint
          npm test
      - name: Rust checks
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
  build:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build desktop application
        run: npm run tauri build
      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          Copy-Item src-tauri/target/release/tasklens.exe dist-artifacts/TaskLens-portable-x64.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-artifacts/
          Get-ChildItem dist-artifacts -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist-artifacts/SHA256SUMS.txt
          Get-Content dist-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tasklens-windows-x64-unsigned
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 14
